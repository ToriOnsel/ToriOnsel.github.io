<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL MASTER LG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background-color: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        
        .play-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
            transition: all 0.3s ease;
        }
        
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
        }
        
        .play-btn.playing {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }
        
        .texto {
            font-size: 35px;
            font-weight: bold;
            color: #1A237E;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .imagen {
            width: 100%;
            max-width: 350px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .imagen:hover {
            transform: scale(1.8);
        }
        
        .audio-info {
            margin-top: 30px;
            font-size: 20px;
            color: #7809ef;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="play-btn" id="playButton">▶</button>
        <div class="texto">CONTROL MASTER LG <br> <h5>ACERCA EL IR A TU TV</h5></div>
        <img class="imagen" src="diagram.jpeg" alt="CONEXION DE AUDIO L/R PARA IR">
        <div class="audio-info"><b>CODIGO SERVICE MODE LG</b><br>0000 / 8743<br>1147 / 2008<br>0413 / 8741<br>8878 / 7777<br>1234 / 2200<br>1111 / 0110</div>
        
        <audio id="audioPlayer" loop>
            <source src="serv-EzAdjust.Wav" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const playButton = document.getElementById('playButton');
            const audioPlayer = document.getElementById('audioPlayer');
            let isPlaying = false;
            
            playButton.addEventListener('click', function() {
                if (isPlaying) {
                    audioPlayer.pause();
                    playButton.innerHTML = '▶';
                    playButton.classList.remove('playing');
                } else {
                    audioPlayer.play();
                    playButton.innerHTML = '⏹';
                    playButton.classList.add('playing');
                }
                isPlaying = !isPlaying;
            });
            
            // Intenta cargar el audio y mostrar un mensaje si hay error
            audioPlayer.addEventListener('error', function() {
                alert('Error al cargar el audio. Por favor, intenta recargar la página.');
            });
        });
    </script>
</body>
</html>
